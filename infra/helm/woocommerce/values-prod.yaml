# Production-ready Values for WooCommerce (VPS/k3s)
wordpressUsername: admin
service:
  type: ClusterIP
ingress:
  enabled: true
  ingressClassName: traefik # / nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/tls-acme: "true"
persistence:
  enabled: true
  size: 10Gi
mariadb:
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

# Automation & Self-Healing
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10

lifecycleHooks:
  postStart:
    exec:
      command:
        - /bin/bash
        - -c
        - |
          # URUMI AUTO-PROVISIONING SCRIPT
          echo "⏳ Hook Started: Waiting for WordPress Core..."

          # Wait until WordPress is installed
          until wp core is-installed --allow-root; do 
            echo "   ...waiting for WP..."
            sleep 5
          done

          echo "✅ WordPress is Live! Starting Configuration..."

          # Get store URL from release name
          STORE_URL="http://{{ .Release.Name }}.${BASE_DOMAIN:-127.0.0.1.nip.io}"
          echo "🌐 Setting URLs to $STORE_URL..."
          wp option update siteurl "$STORE_URL" --allow-root
          wp option update home "$STORE_URL" --allow-root

          # Clean up default content
          echo "🧹 Removing default content..."
          wp post delete 1 --force --allow-root 2>/dev/null || true
          wp post delete 2 --force --allow-root 2>/dev/null || true

          # Rename Site
          echo "🏷️ Renaming Site..."
          wp option update blogname "Urumi Store" --allow-root
          wp option update blogdescription "Kubernetes-Orchestrated WooCommerce" --allow-root

          # Install & Activate WooCommerce
          echo "📦 Installing WooCommerce..."
          wp plugin install woocommerce --activate --force --allow-root

          # Install & Activate Astra Theme
          echo "🎨 Installing Astra Theme..."
          wp theme install astra --activate --allow-root

          # Setup Store Pages
          echo "📄 Creating Store Pages..."
          wp wc tool run install_pages --user=admin --allow-root

          # Set Homepage to Shop
          echo "🏠 Setting Homepage..."
          shop_page_id=$(wp post list --name=shop --field=ID --post_type=page --allow-root 2>/dev/null || echo "")
          if [ -n "$shop_page_id" ]; then
            wp option update show_on_front 'page' --allow-root
            wp option update page_on_front $shop_page_id --allow-root
          fi

          # Create Product Categories
          echo "📂 Creating Categories..." >> /tmp/provision.log
          CLOTHING_CAT_ID=$(wp wc product_category create --name="Clothing" --user=admin --porcelain --allow-root 2>/dev/null || echo "")
          echo "Category ID: $CLOTHING_CAT_ID" >> /tmp/provision.log

          # Function to create product safely
          create_product() {
            local name="$1"
            local price="$2"
            local image="$3"
            local cat_id="$4"
            
            echo "Creating $name..." >> /tmp/provision.log
            
            # 1. Create Base Product
            PID=$(wp wc product create --name="$name" --type=simple --regular_price="$price" --user=admin --porcelain --allow-root 2>>/tmp/provision.log)
            
            if [ -n "$PID" ]; then
              echo "✅ Created $name (ID: $PID)" >> /tmp/provision.log
              
              # 2. Assign Category
              if [ -n "$cat_id" ]; then
                 wp wc product update $PID --categories="[{\"id\": $cat_id}]" --user=admin --allow-root >> /tmp/provision.log 2>&1
              fi

              # 3. Assign Image
              if [ -n "$image" ]; then
                 wp wc product update $PID --images="[{\"src\": \"$image\"}]" --user=admin --allow-root >> /tmp/provision.log 2>&1
              fi
            else
              echo "❌ Failed to create $name" >> /tmp/provision.log
            fi
          }

          # Run Creation
          create_product "Urumi Beanie" "15" "https://images.unsplash.com/photo-1576871337622-98d48d1cf531?w=800" "$CLOTHING_CAT_ID"
          create_product "Urumi Hoodie" "45" "https://images.unsplash.com/photo-1556906781?w=800" "$CLOTHING_CAT_ID"
          create_product "Urumi Mug"    "12" "https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=800" ""

          echo "🚀 PROVISIONING COMPLETE!" >> /tmp/provision.log

          echo "🚀 PROVISIONING COMPLETE!"
